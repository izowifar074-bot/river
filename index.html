<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>梦中暗河</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="一条梦中的地下河：拱形水道、深不见顶的峡谷、地下湖洞厅，用像素方块搭成，可自由旋转缩放，也可以乘船漂流。">
<style>
/* Layout: full-bleed WebGL cave; quiet glass labels in the corners; a cave-survey profile as the journey bar along the bottom. */
:root {
  --void: #04060a;
  --veil: rgba(5, 10, 17, 0.62);
  --line: rgba(150, 210, 225, 0.17);
  --line-hot: rgba(143, 233, 210, 0.55);
  --text: #d8e5ec;
  --muted: #7f93a1;
  --lichen: #8fe9d2;
  --sump: #5d9dff;
  --wisp: #ffcf98;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
  --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--void); color: var(--text);
  font-family: var(--sans); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button { font: inherit; color: inherit; }

/* ---- title ---- */
#title {
  position: fixed; pointer-events: none;
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  left: max(20px, calc(env(safe-area-inset-left, 0px) + 12px));
  max-width: min(420px, 70vw);
}
#title h1 {
  margin: 0; font-family: var(--serif); font-weight: 600;
  font-size: clamp(24px, 3vw, 36px); letter-spacing: 0.34em; line-height: 1.15;
  color: #e6f1f4; text-shadow: 0 0 26px rgba(143, 233, 210, 0.28);
}
#title p { margin: 10px 0 0; font-size: 12.5px; line-height: 1.75; letter-spacing: 0.14em; color: var(--muted); text-wrap: balance; }
#title p b { font-weight: 500; color: #a9bfcb; }

/* ---- top-right: destinations + settings ---- */
#topbar {
  position: fixed; display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px));
}
.row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.label { font-size: 11px; letter-spacing: 0.22em; color: var(--muted); margin-right: 4px; align-self: center; }
.chip {
  border: 1px solid var(--line); background: var(--veil); color: var(--text);
  border-radius: 999px; padding: 7px 13px; font-size: 12.5px; letter-spacing: 0.08em; line-height: 1.2;
  cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: border-color .2s, background .2s, color .2s;
}
.chip:hover { border-color: var(--line-hot); }
.chip:focus-visible, .seg button:focus-visible, #btn-play:focus-visible, #profile:focus-visible { outline: 2px solid var(--lichen); outline-offset: 2px; }
.chip.on { background: rgba(143, 233, 210, 0.13); border-color: var(--line-hot); color: #effffb; }
.chip.small { padding: 6px 10px; font-size: 12px; }

/* ---- bottom dock ---- */
#dock {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(18px, calc(env(safe-area-inset-left, 0px) + 12px));
  padding-right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-top: 40px;
  background: linear-gradient(to top, rgba(3, 6, 10, 0.86) 0%, rgba(3, 6, 10, 0.55) 55%, rgba(3, 6, 10, 0) 100%);
  pointer-events: none;
}
#dock > * { pointer-events: auto; }
#caption {
  pointer-events: none !important;
  font-family: var(--serif); font-size: clamp(15px, 1.55vw, 19px); line-height: 1.85; letter-spacing: 0.14em;
  text-align: center; color: #eef6f8; max-width: 34em; margin: 0 auto 14px; min-height: 1.9em;
  text-shadow: 0 0 2px rgba(0, 0, 0, 0.95), 0 0 22px rgba(0, 0, 0, 0.9);
  opacity: 0; transform: translateY(6px); transition: opacity 1.4s ease, transform 1.4s ease; text-wrap: balance;
}
#caption.show { opacity: 1; transform: none; }
.dock-row { display: flex; align-items: center; gap: 14px; }
#btn-play {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 9px;
  border: 1px solid var(--line-hot); background: rgba(143, 233, 210, 0.12); color: #effffb;
  border-radius: 999px; padding: 10px 18px 10px 14px; font-size: 13.5px; letter-spacing: 0.12em; cursor: pointer;
  box-shadow: 0 0 28px rgba(143, 233, 210, 0.12);
}
#btn-play:hover { background: rgba(143, 233, 210, 0.2); }
#btn-play svg { width: 14px; height: 14px; fill: currentColor; }
#profile { position: relative; flex: 1 1 auto; min-width: 0; height: 62px; cursor: pointer; border-radius: 8px; touch-action: none; }
#profile canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.side { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--veil); overflow: hidden; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 12.5px; letter-spacing: 0.08em; cursor: pointer; color: var(--muted); }
.seg button.on { color: #effffb; background: rgba(143, 233, 210, 0.14); }
#readout { font-size: 11.5px; letter-spacing: 0.1em; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
#readout b { color: var(--text); font-weight: 500; }
#readout .dive { color: #9cc6ff; }
#hint { margin-top: 10px; font-size: 11.5px; letter-spacing: 0.12em; color: rgba(127, 147, 161, 0.8); text-align: center; }

/* ---- loader ---- */
#loader {
  position: fixed; inset: 0; display: grid; place-items: center; background: var(--void); z-index: 10;
  transition: opacity 1.8s ease; padding: 24px;
}
#fade { position: fixed; inset: 0; background: #eef2f4; opacity: 0; pointer-events: none; }
#loader.gone { opacity: 0; pointer-events: none; }
.ld { width: min(360px, 80vw); text-align: center; }
.ld h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 30px; letter-spacing: 0.4em; color: #e6f1f4; text-shadow: 0 0 30px rgba(143, 233, 210, 0.3); }
.ld p { margin: 14px 0 26px; font-size: 12.5px; letter-spacing: 0.24em; color: var(--muted); }
.ld-track { height: 1px; background: rgba(150, 210, 225, 0.14); overflow: hidden; }
#load-bar { height: 100%; background: var(--lichen); transform-origin: 0 50%; transform: scaleX(0); transition: transform .4s ease; box-shadow: 0 0 12px var(--lichen); }
#load-stage { margin-top: 14px; font-size: 12px; letter-spacing: 0.2em; color: var(--muted); min-height: 1.5em; }
#load-error { margin-top: 18px; font-size: 13px; line-height: 1.8; color: #ffb4a8; letter-spacing: 0.06em; }

#title, #topbar, .dock-row, #hint { transition: opacity 1.6s ease; }
#dock { transition: background 1.6s ease; }
body.waking #title, body.waking #topbar, body.waking .dock-row, body.waking #hint { opacity: 0; pointer-events: none; }
body.waking #dock { background: transparent; }
body.waking #caption { color: #1f2d36; text-shadow: none; }

@media (max-width: 760px) {
  #title { max-width: none; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  #title h1 { font-size: 24px; }
  #title p { display: none; }
  #topbar {
    top: calc(env(safe-area-inset-top, 0px) + 58px);
    left: max(16px, env(safe-area-inset-left, 0px)); right: 0;
    align-items: stretch; gap: 7px;
  }
  #topbar .row { justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; padding-right: max(16px, env(safe-area-inset-right, 0px)); scrollbar-width: none; touch-action: pan-x; }
  #topbar .row::-webkit-scrollbar { display: none; }
  #topbar .label { display: none; }
  .chip { flex: 0 0 auto; }
  .dock-row { flex-wrap: wrap; gap: 10px; }
  #profile { order: -1; flex-basis: 100%; height: 54px; }
  .side { flex-direction: row; align-items: center; margin-left: auto; }
  #readout { display: none; }
  #hint { display: none; }
  #caption { font-size: 14.5px; letter-spacing: 0.08em; }
}
@media (max-width: 460px) {
  .chip { padding: 6px 10px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  #caption, #loader { transition: none; }
}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="地下河洞穴三维视图：拖动旋转，滚轮缩放"></canvas>

<header id="title">
  <h1>梦中暗河</h1>
  <p>坐船穿过一条地下河：<b>拱形水道</b> → <b>深不见顶的峡谷</b> → <b>地下湖洞厅</b>。途中几处河道没入水下，只能潜过去。</p>
</header>

<div id="topbar">
  <div class="row dest">
    <span class="label">去往</span>
    <button class="chip" data-view="overview">全景</button>
    <button class="chip" data-view="tunnel">拱形水道</button>
    <button class="chip" data-view="canyon">峡谷</button>
    <button class="chip" data-view="hall">地下湖</button>
    <button class="chip" data-view="sumps">水下通道</button>
  </div>
  <div class="row settings">
    <span class="label">设置</span>
    <button class="chip small" id="opt-speed">速度 1×</button>
    <button class="chip small" id="opt-full">全屏</button>
  </div>
</div>

<footer id="dock">
  <div id="caption" aria-live="polite"></div>
  <div class="dock-row">
    <button id="btn-play" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="play-icon" d="M4 2.5v11l9-5.5z"/></svg><span id="play-text">开始漂流</span></button>
    <div id="profile" role="slider" tabindex="0" aria-label="航程纵剖面，点击跳转" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <canvas id="profile-bg"></canvas>
      <canvas id="profile-fg"></canvas>
    </div>
    <div class="side">
      <div class="seg" role="group" aria-label="视角">
        <button data-mode="orbit" class="on">自由视角</button>
        <button data-mode="boat">船上视角</button>
      </div>
      <div id="readout">—</div>
    </div>
  </div>
  <div id="hint">拖动旋转 · 滚轮缩放 · 右键或双指平移 · 双击岩壁飞过去</div>
</footer>

<div id="fade"></div>
<div id="loader">
  <div class="ld">
    <h2>梦中暗河</h2>
    <p>正在入梦</p>
    <div class="ld-track"><div id="load-bar"></div></div>
    <div id="load-stage">……</div>
    <div id="load-error" hidden></div>
  </div>
</div>

<script>
(async function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
function fail(msg) { var el = $('load-error'); if (el) { el.hidden = false; el.textContent = msg; } }
window.addEventListener('error', function (e) { fail('出错了：' + (e.message || e)); });

var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms || 16); }); };
function stage(text, f) {
  $('load-stage').textContent = text;
  $('load-bar').style.transform = 'scaleX(' + f + ')';
  return wait(24);
}
var MOBILE = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || Math.min(screen.width, screen.height) < 700;

/* A small Catmull-Rom spline with arc-length lookup (replaces three.js curves). */
function makeSpline(pts) {
  var P = pts.map(function (p) { return Array.isArray(p) ? { x: p[0], y: p[1], z: p[2] } : p; });
  var S = [], n = P.length;
  function cr(a, b, c, d, t) {
    var t2 = t * t, t3 = t2 * t;
    return 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
  }
  for (var i = 0; i < n - 1; i++) {
    var p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(n - 1, i + 2)];
    for (var k = 0; k < 24; k++) {
      var t = k / 24;
      S.push({ x: cr(p0.x, p1.x, p2.x, p3.x, t), y: cr(p0.y, p1.y, p2.y, p3.y, t), z: cr(p0.z, p1.z, p2.z, p3.z, t) });
    }
  }
  S.push({ x: P[n - 1].x, y: P[n - 1].y, z: P[n - 1].z });
  var L = new Float64Array(S.length);
  for (var j = 1; j < S.length; j++) L[j] = L[j - 1] + Math.hypot(S[j].x - S[j - 1].x, S[j].y - S[j - 1].y, S[j].z - S[j - 1].z);
  var total = L[S.length - 1];
  function find(u) {
    var d = Math.min(Math.max(u, 0), 1) * total, lo = 0, hi = S.length - 1;
    while (hi - lo > 1) { var m = (lo + hi) >> 1; if (L[m] <= d) lo = m; else hi = m; }
    var f = (d - L[lo]) / Math.max(1e-9, L[hi] - L[lo]);
    return { lo: lo, hi: hi, f: f };
  }
  return {
    length: total,
    pointAt: function (u) {
      var r = find(u), a = S[r.lo], b = S[r.hi];
      return { x: a.x + (b.x - a.x) * r.f, y: a.y + (b.y - a.y) * r.f, z: a.z + (b.z - a.z) * r.f };
    },
    tangentAt: function (u) {
      var r = find(u), a = S[Math.max(0, r.lo - 1)], b = S[Math.min(S.length - 1, r.hi + 1)];
      var x = b.x - a.x, y = b.y - a.y, z = b.z - a.z, l = Math.hypot(x, y, z) || 1;
      return { x: x / l, y: y / l, z: z / l };

  };
}
/* =====================================================================
   Math / noise
   ===================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth01 = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const bump = (x, c, w) => { const d = Math.abs(x - c) / w; return d >= 1 ? 0 : (1 - d * d) * (1 - d * d); };
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash3(x, y, z, s) {
  let h = (s | 0) ^ 0x9e3779b9;
  h = Math.imul(h ^ (x | 0), 0x85ebca6b); h = (h << 13) | (h >>> 19);
  h = Math.imul(h ^ (y | 0), 0xc2b2ae35); h = (h << 13) | (h >>> 19);
  h = Math.imul(h ^ (z | 0), 0x27d4eb2f); h = (h << 13) | (h >>> 19);
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise3(x, y, z, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  let fx = x - xi, fy = y - yi, fz = z - zi;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const a = hash3(xi, yi, zi, s), b = hash3(xi + 1, yi, zi, s), c = hash3(xi, yi + 1, zi, s), d = hash3(xi + 1, yi + 1, zi, s);
  const e = hash3(xi, yi, zi + 1, s), f = hash3(xi + 1, yi, zi + 1, s), g = hash3(xi, yi + 1, zi + 1, s), h = hash3(xi + 1, yi + 1, zi + 1, s);
  const x1 = a + (b - a) * fx, x2 = c + (d - c) * fx, x3 = e + (f - e) * fx, x4 = g + (h - g) * fx;
  const y1 = x1 + (x2 - x1) * fy, y2 = x3 + (x4 - x3) * fy;
  return (y1 + (y2 - y1) * fz) * 2 - 1;
}
function vnoise2(x, z, s = 0) {
  const xi = Math.floor(x), zi = Math.floor(z);
  let fx = x - xi, fz = z - zi;
  fx = fx * fx * (3 - 2 * fx); fz = fz * fz * (3 - 2 * fz);
  const a = hash3(xi, 0, zi, s), b = hash3(xi + 1, 0, zi, s), c = hash3(xi, 0, zi + 1, s), d = hash3(xi + 1, 0, zi + 1, s);
  return (a + (b - a) * fx + (c - a) * fz + (a - b - c + d) * fx * fz) * 2 - 1;
}
function vnoise1(x, s = 0) {
  const xi = Math.floor(x); let f = x - xi; f = f * f * (3 - 2 * f);
  const a = hash3(xi, 0, 0, s), b = hash3(xi + 1, 0, 0, s);
  return (a + (b - a) * f) * 2 - 1;

/* =====================================================================
   World layout (1 block = 1 m)
   ===================================================================== */
const SX = 584, SY = 160, SZ = 176, N = SX * SY * SZ;
const DZ = SX, DY = SX * SZ;
const WL = 30;               // voxels with y < WL are water
const SURF = WL - 0.15;      // rendered water surface
const ZC = 88;               // river axis (z)
const LMAX = 15;

const AIR = 0, WATER = 1, ROCK = 2, LIME = 3, LIME2 = 4, DEEP = 5, ANDE = 6, TUFF = 7, CALC = 8, DRIP = 9,
  GRAVEL = 10, SAND = 11, CLAY = 12, MUD = 13, LICHEN = 14, WORM = 15, AMETH = 16, PEARL = 17, RIM = 18;

// tags of open voxels: which part of the cave they belong to
const T_GROTTO = 1, T_TUNNEL = 2, T_SUMP = 3, T_CANYON = 4, T_HALL = 5, T_SIDE = 6, T_EXIT = 7, T_GEODE = 8, T_GOUR = 9, T_SHAFT = 10, T_CHAMBER = 11;
const TAGPRI = [0, 2, 2, 3, 2, 1, 5, 2, 9, 8, 6, 7];

const X_TUN0 = 30, X_TUN1 = 196, X_CAP0 = 178, X_CAP1 = 191;
const X_CAN0 = 212, X_CAN1 = 366, CW = 18;   // canyon: walls ~37 m apart
const X_SAG0 = 92, X_SAG1 = 120;              // mid-tunnel sump: the arch sags under the water
const HALL = { x: 486, z: ZC, rx: 74, rz: 66, h: 54 };
const LAKE = { x: 468, z: ZC + 2, rx: 62, rz: 46 };
const ISLE = { x: 476, z: ZC - 4, r: 12 };
const GOUR = { x0: 516, x1: 551, z0: ZC - 38, z1: ZC + 4 };
const EXITL = { x0: 512, z0: ZC + 24, x1: 566, z1: ZC + 34.6 };

const vox = new Uint8Array(N).fill(ROCK);
const tag = new Uint8Array(N);
const I = (x, y, z) => x + SX * (z + SZ * y);
const inside = (x, y, z) => x >= 0 && y >= 0 && z >= 0 && x < SX && y < SY && z < SZ;

function setOpen(x, y, z, tg) {
  if (x < 2 || y < 2 || z < 2 || x > SX - 3 || y > SY - 3 || z > SZ - 3) return;
  const i = x + SX * (z + SZ * y);
  if (vox[i] !== AIR) { vox[i] = AIR; tag[i] = tg; }
}
function setSolid(x, y, z, m) {
  if (x < 2 || y < 2 || z < 2 || x > SX - 3 || y > SY - 3 || z > SZ - 3) return;
  vox[x + SX * (z + SZ * y)] = m;
}

function tunnelZ(x) { const t = clamp(x, X_TUN0, X_TUN1); return ZC + 15 * Math.sin((2 * Math.PI * (t - X_TUN0)) / (X_TUN1 - X_TUN0)); }
function tunnelSlope(x) {
  if (x < X_TUN0 || x > X_TUN1) return 0;
  return ((15 * 2 * Math.PI) / (X_TUN1 - X_TUN0)) * Math.cos((2 * Math.PI * (x - X_TUN0)) / (X_TUN1 - X_TUN0));
}
function tunnelP(x) {
  const a = 9.5 + 0.8 * vnoise1(x * 0.03, 11);   // half width: ~19 m across at the water
  const s = 4.6 + 0.6 * vnoise1(x * 0.05, 23);   // vertical side walls
  const ah = a * 0.78;                            // wide, flattened arch: crown ~12 m above the water
  const top = s + ah;
  const dip = smooth01((x - X_SAG0) / 10) - smooth01((x - X_SAG1) / 10);
  let cap = dip > 0 ? top + 4 - (top + 7.5) * dip : 99;
  if (x > X_CAP0) cap = Math.min(cap, top + 4 - (top + 7.5) * smooth01((x - X_CAP0) / (X_CAP1 - X_CAP0)));
  const deep = 7 * (smooth01((x - X_SAG0 - 4) / 8) - smooth01((x - X_SAG1 - 2) / 8));
  return { a, s, ah, top, cap, deep };
}
const fissOff = (x) => 0.9 * Math.sin(x * 0.13) + 0.5 * Math.sin(x * 0.29 + 1.0);
const exitZ = (x) => EXITL.z0 + ((x - EXITL.x0) / (EXITL.x1 - EXITL.x0)) * (EXITL.z1 - EXITL.z0);

// Glow-lichen "lamps" along the ceiling joint of the arched tunnel
const LAMP = new Uint8Array(SX);
for (let lx0 = 34; lx0 < X_CAP0 - 6; lx0 += 11) {

  const lx = Math.round(lx0 + (hash3(lx0, 1, 2, 9) - 0.5) * 3);
  for (let d = -1; d <= 1; d++) LAMP[lx + d] = 1;

// Rock strata (horizontal beds, slightly warped)
const STRATA = new Uint8Array(SY + 40);
(() => {
  const r = mulberry32(4242);
  const seq = [LIME, LIME2, LIME, TUFF, LIME, DEEP, LIME2, ANDE, LIME, CALC, LIME, DEEP, TUFF, LIME2, LIME, ANDE];
  let y = 0, k = 0;

function strataAt(x, y, z) {
  const o = Math.round(1.8 * Math.sin(x * 0.0105 + 0.6) + 1.2 * Math.sin(z * 0.021 + 1.1));

/* =====================================================================
   Carving
   ===================================================================== */
function carveGrotto() {
  const cx = 19, cy = WL + 1, cz = ZC;
  for (let x = 2; x <= 38; x++) for (let z = cz - 19; z <= cz + 19; z++) for (let y = 3; y <= WL + 14; y++) {
    const dx = (x + 0.5 - cx) / 17, dz = (z + 0.5 - cz) / 16;
    const dv = y + 0.5 - cy, dy = dv > 0 ? dv / 10.5 : dv / 6.5;
    const n = 0.22 * vnoise3(x * 0.13, y * 0.13, z * 0.13, 3) + 0.08 * vnoise3(x * 0.37, y * 0.37, z * 0.37, 4);
    if (dx * dx + dy * dy + dz * dz < 1 + n) { setOpen(x, y, z, T_GROTTO); continue; }
    if (y < WL - 2 && y >= 4) {
      const sr = Math.hypot(x + 0.5 - 13, z + 0.5 - (cz + 1));
      const rad = 4.0 + 0.9 * vnoise3(x * 0.2, y * 0.12, z * 0.2, 5) + Math.max(0, 11 - y) * 0.25;
      if (sr < rad) setOpen(x, y, z, T_SHAFT);
    }
  }
}

function carveTunnel() {
  for (let x = 24; x <= 200; x++) {
    const zc = tunnelZ(x), sl = tunnelSlope(x), cs = 1 / Math.sqrt(1 + sl * sl);
    const P = tunnelP(x), fo = fissOff(x);
    const fissTop = P.top + 3 + 1.0 * vnoise1(x * 0.2, 5);
    for (let z = Math.floor(zc - 15); z <= Math.ceil(zc + 15); z++) {
      const u = (z + 0.5 - zc) * cs;
      for (let y = WL - 15; y <= WL + 18; y++) {
        const v = y + 0.5 - WL;
        if (v >= P.cap) continue;
        const r = 0.35 * vnoise3(x * 0.16, y * 0.16, z * 0.16, 7) + 0.14 * vnoise3(x * 0.45, y * 0.45, z * 0.45, 8);
        const au = Math.abs(u) + r;
        let open = false;
        if (v >= P.s) { const dv = ((v - P.s) * P.a) / P.ah; open = au * au + dv * dv < P.a * P.a; }
        else if (v >= 0) open = au < P.a + (v < 1.5 ? 1.1 : 0);
        else {
          const f = -6.2 - 0.9 * vnoise2(x * 0.07, z * 0.07, 9) + 2.6 * (u / P.a) * (u / P.a) - P.deep;
          open = v > f && au < P.a - 0.16 * -v;
        }
        if (!open && x < X_CAP0 + 2 && v >= P.top - 1.5 && v < fissTop && Math.abs(u - fo) < 1.0) open = true;
        if (open) setOpen(x, y, z, T_TUNNEL);
      }
    }
  }
}

const GROOVES = [18, 34, 51, 69, 88, 104];
const canyonTop = (x) => 116 + 4 * vnoise1(x * 0.025, 31);
const canyonFloor = (x) => -7 - 1.5 * vnoise1(x * 0.06, 37);
function carveCanyon() {
  for (let x = X_CAN0 - 4; x <= X_CAN1 + 4; x++) {
    const top = canyonTop(x), floor = canyonFloor(x);
    const gro = GROOVES.map((g, k) => vnoise1(x * 0.045, 50 + k) > -0.25);
    const nearEnd = x < X_CAN0 + 3 || x > X_CAN1 - 3;
    for (let z = ZC - CW - 3; z <= ZC + CW + 3; z++) {
      const u = Math.abs(z - ZC);
      for (let y = Math.floor(WL + floor) - 1; y <= Math.ceil(WL + top) + 1; y++) {
        const v = y + 0.5 - WL;
        if (v > top || v < floor) continue;
        let hw = CW + 0.5;
        if (v > top - 30) hw = CW + 0.5 - (CW - 0.5) * ((v - (top - 30)) / 30);
        for (let g = 0; g < GROOVES.length; g++) if (gro[g] && Math.abs(v - GROOVES[g]) < 0.5) hw += 1.2;
        if (v > -0.8 && v < 1.4) hw += 1.1;
        if (v < -3) hw -= (-3 - v) * 0.8;
        if (u >= hw) continue;
        if (nearEnd) {
          const e = 1.6 * vnoise3(x * 0.21, y * 0.21, z * 0.21, 61);
          if (x < X_CAN0 + e || x > X_CAN1 + e) continue;
        }
        setOpen(x, y, z, T_CANYON);
      }
    }
  }
}

function hallFloorCeil(x, z) {
  const dx = (x + 0.5 - HALL.x) / HALL.rx, dz = (z + 0.5 - HALL.z) / HALL.rz;
  const rr = Math.hypot(dx, dz);
  const ca = rr > 1e-6 ? dx / rr : 1, sa = rr > 1e-6 ? dz / rr : 0;
  const rw = 1 + 0.06 * vnoise2(ca * 2.2 + 5, sa * 2.2 + 5, 71) + 0.035 * vnoise2(ca * 6 + 9, sa * 6 + 9, 72);
  const r = rr / rw;
  if (r > 1) return null;
  let ceil = 7 + (HALL.h - 7) * Math.pow(Math.max(0, 1 - r * r), 0.55) + 3.5 * vnoise2(x * 0.035, z * 0.035, 73)
    + 4.5 * Math.max(0, vnoise2(x * 0.07, z * 0.07, 74) - 0.25);
  const ldx = (x + 0.5 - LAKE.x) / LAKE.rx, ldz = (z + 0.5 - LAKE.z) / LAKE.rz;
  const lr = Math.hypot(ldx, ldz) * (1 + 0.06 * vnoise2(x * 0.05, z * 0.05, 75));
  let floor, crisp = false;
  if (lr < 1) floor = -2.5 - 14 * Math.pow(1 - lr * lr, 0.6) + 1.5 * vnoise2(x * 0.08, z * 0.08, 76);
  else floor = Math.min((lr - 1) * 32, 8 + 2.5 * vnoise2(x * 0.04, z * 0.04, 77)) + vnoise2(x * 0.12, z * 0.12, 78) - 0.5;
  const id = Math.hypot(x + 0.5 - ISLE.x, z + 0.5 - ISLE.z);
  if (id < ISLE.r + 4) floor = Math.max(floor, 2.6 - 2.6 * Math.pow(id / ISLE.r, 2.5) + 0.4 * vnoise2(x * 0.2, z * 0.2, 79));
  // rimstone terraces (gours) on the north-east shore
  if (x >= GOUR.x0 && x <= GOUR.x1 && z >= GOUR.z0 && z <= GOUR.z1 && lr > 1.06 && r < 0.9) {
    floor = gourLevel(x, z); crisp = true;
  }
  // the river leaves the lake through a channel to the east
  const ex = clamp(x, EXITL.x0, EXITL.x1), ed = Math.abs(z + 0.5 - exitZ(ex));
  if (x >= EXITL.x0 - 2 && ed < 4.2) { floor = Math.min(floor, -3.2 - 0.6 * vnoise2(x * 0.2, z * 0.2, 80)); crisp = false; }
  return { r, floor, ceil, crisp };
}
function gourLevel(x, z) {
  return clamp(Math.floor((x - GOUR.x0) * 0.27 + 2.6 * vnoise2(x * 0.06, z * 0.09, 85) + 0.9 * vnoise2(x * 0.2, z * 0.2, 86) + 1.4), 1, 10);
}

function carveHall() {
  for (let x = HALL.x - HALL.rx - 8; x <= HALL.x + HALL.rx + 8; x++) {
    for (let z = HALL.z - HALL.rz - 8; z <= HALL.z + HALL.rz + 8; z++) {
      const c = hallFloorCeil(x, z);
      if (!c) continue;
      const yf = WL + c.floor, yc = WL + c.ceil;
      for (let y = Math.floor(yf) - 2; y <= Math.ceil(yc) + 3; y++) {
        const v = y + 0.5;
        let open;
        if (c.crisp) open = v > yf && v < yc + 2.4 * vnoise3(x * 0.17, y * 0.17, z * 0.17, 83);
        else if (v > yf + 2.5 && v < yc - 3.5) open = true;
        else {
          const n = vnoise3(x * 0.17, y * 0.17, z * 0.17, 83);
          open = v > yf + n * 1.3 && v < yc + n * 2.4;
        }
        if (open && c.r > 0.84) {
          const n2 = vnoise3(x * 0.11, y * 0.11, z * 0.11, 84);
          if (c.r + n2 * 0.05 > 0.995) open = false;
        }
        if (open) setOpen(x, y, z, T_HALL);
      }
    }
  }
}

function carveExit() {
  for (let x = 548; x <= 576; x++) {
    const zc = exitZ(x);
    const cap = x < 565 ? 99 : lerp(6.5, -2.4, smooth01((x - 565) / 8));
    for (let z = Math.floor(zc - 7); z <= Math.ceil(zc + 7); z++) {
      const u = z + 0.5 - zc;
      for (let y = WL - 6; y <= WL + 10; y++) {
        const v = y + 0.5 - WL;
        if (v >= cap) continue;
        const au = Math.abs(u) + 0.45 * vnoise3(x * 0.2, y * 0.2, z * 0.2, 88);
        let open = false;
        if (v >= 1.5) { const dv = (v - 1.5) * 3.6 / 4.2; open = au * au + dv * dv < 3.6 * 3.6; }
        else open = v > -3.6 + 1.2 * (u / 3.6) * (u / 3.6) && au < 3.6;
        if (open) setOpen(x, y, z, T_EXIT);
      }
    }
  }
}

function carveBall(cx, cy, cz, r, seed, tg, maxY = 1e9) {
  const R = Math.ceil(r + 1);
  for (let y = Math.floor(cy - R); y <= Math.ceil(cy + R); y++) {
    if (y > maxY) continue;
    for (let z = Math.floor(cz - R); z <= Math.ceil(cz + R); z++) for (let x = Math.floor(cx - R); x <= Math.ceil(cx + R); x++) {
      const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy, z + 0.5 - cz);
      if (d < r + 0.45 * vnoise3(x * 0.3, y * 0.3, z * 0.3, seed)) setOpen(x, y, z, tg);
    }
  }
}
function carveTube(pts, rad, seed, tg) {
  const curve = makeSpline(pts);
  const len = curve.length, n = Math.ceil(len / 0.4);
  for (let k = 0; k <= n; k++) {
    const p = curve.pointAt(k / n);
    carveBall(p.x, p.y, p.z, rad * (1 + 0.18 * vnoise1(k * 0.05, seed)), seed, tg);
  }
}

// Narrow, fully flooded side passages that branch off the sumps and channels
const chambers = [];
function carveWorm(sx, sy, sz, yaw, len, rad, seed) {
  const r = mulberry32(seed);
  let x = sx, y = sy, z = sz, pitch = 0;
  const ceilY = WL - 3.2;
  for (let s = 0; s < len; s += 0.5) {
    yaw += (r() - 0.5) * 0.32;
    pitch = clamp(pitch + (r() - 0.5) * 0.2, -0.45, 0.45);
    x += Math.cos(yaw) * Math.cos(pitch) * 0.5;
    z += Math.sin(yaw) * Math.cos(pitch) * 0.5;
    y += Math.sin(pitch) * 0.5;
    if (y > ceilY - rad) { y = ceilY - rad; pitch = -Math.abs(pitch) - 0.1; }
    if (y < 6) { y = 6; pitch = Math.abs(pitch); }
    const rr = rad * (0.8 + 0.4 * (vnoise1(s * 0.25, seed) * 0.5 + 0.5));
    carveBall(x, y, z, rr, seed, T_SIDE, ceilY);
  }
  const cr = rad * 2.3;
  const cy = Math.min(y, ceilY - cr - 0.5);
  carveBall(x, cy, z, cr, seed + 1, T_CHAMBER, ceilY);
  chambers.push([x, cy, z, cr]);
}
const WORMS = [

/* =====================================================================
   Formations
   ===================================================================== */
function scanFloor(x, z, yStart) { // first solid voxel at/under yStart walking down through open space
  for (let y = yStart; y > 1; y--) if (vox[I(x, y, z)] >= 2) return y;
  return -1;
}
function scanCeil(x, z, yStart) {
  for (let y = yStart; y < SY - 1; y++) if (vox[I(x, y, z)] >= 2) return y;
  return -1;
}
function fillDisk(cx, cz, y, r, m, flutes = 0, phase = 0) {
  const R = Math.ceil(r + 1.5);
  for (let z = Math.floor(cz - R); z <= Math.ceil(cz + R); z++) for (let x = Math.floor(cx - R); x <= Math.ceil(cx + R); x++) {
    const dx = x + 0.5 - cx, dz = z + 0.5 - cz;
    let rr = r;
    if (flutes) rr *= 1 + flutes * Math.sin(Math.atan2(dz, dx) * 7 + phase);
    if (dx * dx + dz * dz < rr * rr) setSolid(x, y, z, m);
  }
}
function column(cx, cz, rMid, seed) {
  const fy = scanFloor(Math.round(cx), Math.round(cz), WL + 14);
  const cy = scanCeil(Math.round(cx), Math.round(cz), WL + 14);
  if (fy < 0 || cy < 0) return;
  for (let y = fy - 1; y <= cy + 1; y++) {
    const hb = y - fy, ht = cy - y;
    const r = rMid + 3.0 * Math.exp(-hb / 4.0) + 6.0 * Math.exp(-ht / 6.5) + 0.6 * vnoise1(y * 0.15, seed);
    const m = vnoise1(y * 0.21, seed + 3) > 0.55 ? DRIP : CALC;
    fillDisk(cx, cz, y, r, m, 0.1, y * 0.06 + seed);
  }
}
function stalactite(x, z, len, r0, seed) {
  const cy = scanCeil(x, z, WL + 3);
  if (cy < 0) return;
  const fy = scanFloor(x, z, cy - 1);
  len = Math.min(len, cy - Math.max(fy, WL) - 3);
  for (let k = 0; k < len; k++) {
    const t = k / len;
    fillDisk(x + 0.5, z + 0.5, cy - 1 - k, r0 * Math.pow(1 - t, 1.35) + 0.4, hash3(x, k, z, seed) < 0.7 ? DRIP : CALC);
  }
}
function stalagmite(x, z, h, r0, seed) {
  const fy = scanFloor(x, z, WL + 24);
  if (fy < WL) return;
  const cy = scanCeil(x, z, fy + 1);
  h = Math.min(h, cy - fy - 3);
  for (let k = 0; k < h; k++) {
    const t = k / h;
    fillDisk(x + 0.5, z + 0.5, fy + 1 + k, r0 * Math.pow(Math.max(0, 1 - Math.pow(t, 1.6)), 0.6) + 0.45, vnoise1(k * 0.3, seed) > 0.45 ? DRIP : CALC);
  }
}
function boulder(cx, cy, cz, r, seed) {
  const R = Math.ceil(r + 1);
  for (let y = cy - R; y <= cy + R; y++) for (let z = cz - R; z <= cz + R; z++) for (let x = cx - R; x <= cx + R; x++) {
    const d = Math.hypot((x - cx) * 1.0, (y - cy) * 1.25, z - cz);
    if (d < r + 0.8 * vnoise3(x * 0.35, y * 0.35, z * 0.35, seed)) setSolid(x, y, z, ROCK);
  }
}
function hallFormations() {
  const r = mulberry32(777);
  column(ISLE.x, ISLE.z, 5.0, 1);
  column(441, ZC + 50, 3.6, 2);
  column(522, ZC - 49, 4.6, 3);
  column(549, ZC + 27, 3.2, 4);
  column(452, ZC - 25, 2.2, 5);
  // hanging stalactites, some over the lake for reflections
  for (let k = 0; k < 46; k++) {
    const a = r() * Math.PI * 2, rr = Math.sqrt(r()) * 0.85;
    const x = Math.round(HALL.x + Math.cos(a) * rr * HALL.rx), z = Math.round(HALL.z + Math.sin(a) * rr * HALL.rz);
    if (Math.hypot(x - ISLE.x, z - ISLE.z) < 16) continue;
    stalactite(x, z, 5 + Math.floor(r() * r() * 20), 1.2 + r() * 2.6, k);
  }
  // stalagmites + fallen blocks on the dry shores
  for (let k = 0, tries = 0; k < 34 && tries < 600; tries++) {
    const a = r() * Math.PI * 2, rr = 0.55 + r() * 0.37;
    const x = Math.round(HALL.x + Math.cos(a) * rr * HALL.rx), z = Math.round(HALL.z + Math.sin(a) * rr * HALL.rz);
    if (x >= GOUR.x0 - 2 && x <= GOUR.x1 + 2 && z >= GOUR.z0 - 2 && z <= GOUR.z1 + 2) continue;
    if (Math.abs(z + 0.5 - exitZ(clamp(x, EXITL.x0, EXITL.x1))) < 7 && x > EXITL.x0 - 4) continue;
    const fy = scanFloor(x, z, WL + 24);
    if (fy < WL + 1) continue;
    if (k % 3 === 2) boulder(x, fy + 1, z, 2 + r() * 2.6, k + 40);
    else stalagmite(x, z, 4 + Math.floor(r() * r() * 16), 1.1 + r() * 2.3, k + 90);
    k++;
  }
}

// Amethyst geode in the north wall
let GEODE = null;
function carveGeode() {
  const x = 500, y = WL + 9;
  let z = ZC - 20;
  while (z > 4 && vox[I(x, y, z)] <= 1) z--;
  GEODE = [x + 0.5, y + 0.5, z - 1.5];
  carveBall(GEODE[0], GEODE[1], GEODE[2], 4.8, 66, T_GEODE);
}

/* Rimstone pools: a rim on every terrace edge, water behind it */
const poolCells = [];
function buildGours() {
  const lv = new Int16Array((GOUR.x1 - GOUR.x0 + 3) * (GOUR.z1 - GOUR.z0 + 3)).fill(-99);
  const W = GOUR.x1 - GOUR.x0 + 3;
  const L = (x, z) => lv[(z - GOUR.z0 + 1) * W + (x - GOUR.x0 + 1)];
  for (let z = GOUR.z0 - 1; z <= GOUR.z1 + 1; z++) for (let x = GOUR.x0 - 1; x <= GOUR.x1 + 1; x++) {
    const c = hallFloorCeil(x, z);
    let level = -99;
    if (c) {
      const top = scanFloor(x, z, WL + 26);
      if (top >= 0) level = top - WL + 1;
    }
    lv[(z - GOUR.z0 + 1) * W + (x - GOUR.x0 + 1)] = level;
  }
  for (let z = GOUR.z0; z <= GOUR.z1; z++) for (let x = GOUR.x0; x <= GOUR.x1; x++) {
    const c = hallFloorCeil(x, z);
    if (!c || !c.crisp) continue;
    const k = L(x, z);
    if (k < 1) continue;
    const y = WL + k;
    if (vox[I(x, y, z)] !== AIR) continue;
    const rim = L(x + 1, z) < k || L(x - 1, z) < k || L(x, z + 1) < k || L(x, z - 1) < k;
    setSolid(x, y - 1, z, RIM);
    if (rim) setSolid(x, y, z, RIM);
    else { vox[I(x, y, z)] = WATER; tag[I(x, y, z)] = T_GOUR; poolCells.push(I(x, y, z)); }
  }
}

function fillWater() {
  for (let y = 2; y < WL; y++) for (let z = 2; z < SZ - 2; z++) {
    let i = I(2, y, z);
    for (let x = 2; x < SX - 2; x++, i++) if (vox[i] === AIR) vox[i] = WATER;
  }
}

function isLampVoxel(x, y, z) {

  seekX: function (x) { journeyT = timeAtX(x); lastCap = -1; updateBoat(0); },
};
})().catch(function (e) {
  var el = document.getElementById('load-error');
  if (el) { el.hidden = false; el.textContent = '出错了：' + (e && e.message ? e.message : e); }
});
</script>
</body>
</html>
