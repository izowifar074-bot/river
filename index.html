<title>梦中暗河</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="一条梦中的地下河：拱形水道、深不见顶的峡谷、地下湖洞厅，以 3D 像素方块呈现，可自由旋转缩放，也可以乘船漂流。">

<style>
/* Layout: full-bleed WebGL cave; quiet glass labels in the corners; a cave-survey profile as the journey bar along the bottom. */
:root {
  --void: #04060a;
  --veil: rgba(5, 10, 17, 0.62);
  --line: rgba(150, 210, 225, 0.17);
  --line-hot: rgba(143, 233, 210, 0.55);
  --text: #d8e5ec;
  --muted: #7f93a1;
  --lichen: #8fe9d2;
  --sump: #5d9dff;
  --wisp: #ffcf98;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--void); color: var(--text);
  font-family: var(--sans); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button { font: inherit; color: inherit; }

/* ---- title ---- */
#title {
  position: fixed; pointer-events: none;
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  left: max(20px, calc(env(safe-area-inset-left, 0px) + 12px));
  max-width: min(420px, 70vw);
}
#title h1 {
  margin: 0; font-family: var(--serif); font-weight: 600;
  font-size: clamp(24px, 3vw, 36px); letter-spacing: 0.34em; line-height: 1.15;
  color: #e6f1f4; text-shadow: 0 0 26px rgba(143, 233, 210, 0.28);
}
#title p { margin: 10px 0 0; font-size: 12.5px; line-height: 1.75; letter-spacing: 0.14em; color: var(--muted); text-wrap: balance; }
#title p b { font-weight: 500; color: #a9bfcb; }

/* ---- top-right: destinations + settings ---- */
#topbar {
  position: fixed; display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px));
}
.row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.label { font-size: 11px; letter-spacing: 0.22em; color: var(--muted); margin-right: 4px; align-self: center; }
.chip {
  border: 1px solid var(--line); background: var(--veil); color: var(--text);
  border-radius: 999px; padding: 7px 13px; font-size: 12.5px; letter-spacing: 0.08em; line-height: 1.2;
  cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: border-color .2s, background .2s, color .2s;
}
.chip:hover { border-color: var(--line-hot); }
.chip:focus-visible, .seg button:focus-visible, #btn-play:focus-visible, #profile:focus-visible { outline: 2px solid var(--lichen); outline-offset: 2px; }
.chip.on { background: rgba(143, 233, 210, 0.13); border-color: var(--line-hot); color: #effffb; }
.chip.small { padding: 6px 10px; font-size: 12px; }

/* ---- bottom dock ---- */
#dock {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(18px, calc(env(safe-area-inset-left, 0px) + 12px));
  padding-right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-top: 40px;
  background: linear-gradient(to top, rgba(3, 6, 10, 0.86) 0%, rgba(3, 6, 10, 0.55) 55%, rgba(3, 6, 10, 0) 100%);
  pointer-events: none;
}
#dock > * { pointer-events: auto; }
#caption {
  pointer-events: none !important;
  font-family: var(--serif); font-size: clamp(15px, 1.55vw, 19px); line-height: 1.85; letter-spacing: 0.14em;
  text-align: center; color: #eef6f8; max-width: 34em; margin: 0 auto 14px; min-height: 1.9em;
  text-shadow: 0 0 2px rgba(0, 0, 0, 0.95), 0 0 22px rgba(0, 0, 0, 0.9);
  opacity: 0; transform: translateY(6px); transition: opacity 1.4s ease, transform 1.4s ease; text-wrap: balance;
}
#caption.show { opacity: 1; transform: none; }
.dock-row { display: flex; align-items: center; gap: 14px; }
#btn-play {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 9px;
  border: 1px solid var(--line-hot); background: rgba(143, 233, 210, 0.12); color: #effffb;
  border-radius: 999px; padding: 10px 18px 10px 14px; font-size: 13.5px; letter-spacing: 0.12em; cursor: pointer;
  box-shadow: 0 0 28px rgba(143, 233, 210, 0.12);
}
#btn-play:hover { background: rgba(143, 233, 210, 0.2); }
#btn-play svg { width: 14px; height: 14px; fill: currentColor; }
#profile { position: relative; flex: 1 1 auto; min-width: 0; height: 62px; cursor: pointer; border-radius: 8px; touch-action: none; }
#profile canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.side { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--veil); overflow: hidden; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 12.5px; letter-spacing: 0.08em; cursor: pointer; color: var(--muted); }
.seg button.on { color: #effffb; background: rgba(143, 233, 210, 0.14); }
#readout { font-size: 11.5px; letter-spacing: 0.1em; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
#readout b { color: var(--text); font-weight: 500; }
#readout .dive { color: #9cc6ff; }
#hint { margin-top: 10px; font-size: 11.5px; letter-spacing: 0.12em; color: rgba(127, 147, 161, 0.8); text-align: center; }

/* ---- loader ---- */
#loader {
  position: fixed; inset: 0; display: grid; place-items: center; background: var(--void); z-index: 10;
  transition: opacity 1.8s ease; padding: 24px;
}
#loader.gone { opacity: 0; pointer-events: none; }
.ld { width: min(360px, 80vw); text-align: center; }
.ld h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 30px; letter-spacing: 0.4em; color: #e6f1f4; text-shadow: 0 0 30px rgba(143, 233, 210, 0.3); }
.ld p { margin: 14px 0 26px; font-size: 12.5px; letter-spacing: 0.24em; color: var(--muted); }
.ld-track { height: 1px; background: rgba(150, 210, 225, 0.14); overflow: hidden; }
#load-bar { height: 100%; background: var(--lichen); transform-origin: 0 50%; transform: scaleX(0); transition: transform .4s ease; box-shadow: 0 0 12px var(--lichen); }
#load-stage { margin-top: 14px; font-size: 12px; letter-spacing: 0.2em; color: var(--muted); min-height: 1.5em; }
#load-error { margin-top: 18px; font-size: 13px; line-height: 1.8; color: #ffb4a8; letter-spacing: 0.06em; }

#title, #topbar, .dock-row, #hint { transition: opacity 1.6s ease; }
#dock { transition: background 1.6s ease; }
body.waking #title, body.waking #topbar, body.waking .dock-row, body.waking #hint { opacity: 0; pointer-events: none; }
body.waking #dock { background: transparent; }
body.waking #caption { color: #1f2d36; text-shadow: none; }

@media (max-width: 760px) {
  #title { max-width: none; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  #title h1 { font-size: 24px; }
  #title p { display: none; }
  #topbar {
    top: calc(env(safe-area-inset-top, 0px) + 58px);
    left: max(16px, env(safe-area-inset-left, 0px)); right: 0;
    align-items: stretch; gap: 7px;
  }
  #topbar .row { justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; padding-right: max(16px, env(safe-area-inset-right, 0px)); scrollbar-width: none; touch-action: pan-x; }
  #topbar .row::-webkit-scrollbar { display: none; }
  #topbar .label { display: none; }
  .chip { flex: 0 0 auto; }
  .dock-row { flex-wrap: wrap; gap: 10px; }
  #profile { order: -1; flex-basis: 100%; height: 54px; }
  .side { flex-direction: row; align-items: center; margin-left: auto; }
  #readout { display: none; }
  #hint { display: none; }
  #caption { font-size: 14.5px; letter-spacing: 0.08em; }
}
@media (max-width: 460px) {
  .chip { padding: 6px 10px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  #caption, #loader { transition: none; }
}
</style>

    <button class="chip" data-view="canyon">峡谷</button>
    <button class="chip" data-view="hall">地下湖</button>
    <button class="chip" data-view="sumps">水下通道</button>

    <button class="chip small on" id="opt-refl" aria-pressed="true">倒影</button>
    <button class="chip small" id="opt-sound" aria-pressed="false">声音</button>
    <button class="chip small" id="opt-speed">速度 1×</button>
    <button class="chip small" id="opt-full">全屏</button>
  </div>
</div>

<footer id="dock">
  <div id="caption" aria-live="polite"></div>
  <div class="dock-row">
    <button id="btn-play" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="play-icon" d="M4 2.5v11l9-5.5z"/></svg><span id="play-text">开始漂流</span></button>
    <div id="profile" role="slider" tabindex="0" aria-label="航程纵剖面，点击跳转" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <canvas id="profile-bg"></canvas>
      <canvas id="profile-fg"></canvas>

      <div class="seg" role="group" aria-label="视角">
        <button data-mode="orbit" class="on">自由视角</button>
        <button data-mode="boat">船上视角</button>
      </div>
      <div id="readout">—</div>
    </div>
  </div>
  <div id="hint">拖动旋转 · 滚轮缩放 · 右键或双指平移 · 双击岩壁飞过去</div>
</footer>

<div id="loader">
  <div class="ld">
    <h2>梦中暗河</h2>
    <p>正在入梦</p>
    <div class="ld-track"><div id="load-bar"></div></div>
    <div id="load-stage">……</div>
    <div id="load-error" hidden></div>
  </div>
</div>

<script>
  // Plain script: reports problems even if the 3D engine never loads.
  window.__dreamFail = function (msg) {
    var el = document.getElementById('load-error');
    if (el) { el.hidden = false; el.textContent = msg; }
  };
  setTimeout(function () {
    if (!window.__dreamStarted) window.__dreamFail('3D 引擎没有加载成功。这个页面需要联网从 jsDelivr 加载 three.js，请检查网络后刷新。');
  }, 25000);
</script>

    const dx = (x + 0.5 - cx) / 13.5, dz = (z + 0.5 - cz) / 11.5;
    const dv = y + 0.5 - cy, dy = dv > 0 ? dv / 8.5 : dv / 5.5;
    const n = 0.22 * vnoise3(x * 0.13, y * 0.13, z * 0.13, 3) + 0.08 * vnoise3(x * 0.37, y * 0.37, z * 0.37, 4);
    if (dx * dx + dy * dy + dz * dz < 1 + n) { setOpen(x, y, z, T_GROTTO); continue; }
    if (y < WL - 2 && y >= 4) {
      const sr = Math.hypot(x + 0.5 - 13, z + 0.5 - (cz + 1));
      const rad = 4.0 + 0.9 * vnoise3(x * 0.2, y * 0.12, z * 0.2, 5) + Math.max(0, 11 - y) * 0.25;
      if (sr < rad) setOpen(x, y, z, T_SHAFT);
    }
  }
}

function carveTunnel() {
  for (let x = 24; x <= 200; x++) {
    const zc = tunnelZ(x), sl = tunnelSlope(x), cs = 1 / Math.sqrt(1 + sl * sl);
    const P = tunnelP(x), fo = fissOff(x);
    const fissTop = P.top + 2.2 + 0.8 * vnoise1(x * 0.2, 5);
    for (let z = Math.floor(zc - 11); z <= Math.ceil(zc + 11); z++) {
      const u = (z + 0.5 - zc) * cs;
      for (let y = WL - 8; y <= WL + 16; y++) {
        const v = y + 0.5 - WL;
        if (v >= P.cap) continue;
        const r = 0.3 * vnoise3(x * 0.16, y * 0.16, z * 0.16, 7) + 0.12 * vnoise3(x * 0.45, y * 0.45, z * 0.45, 8);
        const au = Math.abs(u) + r;
        let open = false;
        if (v >= P.s) { const dv = ((v - P.s) * P.a) / P.ah; open = au * au + dv * dv < P.a * P.a; }
        else if (v >= 0) open = au < P.a + (v < 1.3 ? 0.9 : 0);
        else {
          const f = -4.4 - 0.7 * vnoise2(x * 0.08, z * 0.08, 9) + 1.7 * (u / P.a) * (u / P.a);
          open = v > f && au < P.a - 0.15 * -v;
        }
        if (!open && x < X_CAP0 + 2 && v >= P.top - 1.5 && v < fissTop && Math.abs(u - fo) < 0.75) open = true;
        if (open) setOpen(x, y, z, T_TUNNEL);
      }
    }
  }
}

const GROOVES = [16, 29, 43, 58, 74];
const canyonTop = (x) => 92 + 4 * vnoise1(x * 0.025, 31);
const canyonFloor = (x) => -5.5 - 1.2 * vnoise1(x * 0.06, 37) - 4.5 * bump(x, X_CHOCK, 9);
function carveCanyon() {
  for (let x = X_CAN0 - 4; x <= X_CAN1 + 4; x++) {
    const top = canyonTop(x), floor = canyonFloor(x);
    const gro = GROOVES.map((g, k) => vnoise1(x * 0.045, 50 + k) > -0.25);
    for (let z = ZC - 7; z <= ZC + 7; z++) {
      const u = Math.abs(z - ZC);
      for (let y = Math.floor(WL + floor) - 1; y <= Math.ceil(WL + top) + 1; y++) {
        const v = y + 0.5 - WL;
        if (v > top || v < floor) continue;
        let hw = 4.5;
        if (v > top - 16) hw = 4.5 - 4.0 * ((v - (top - 16)) / 16);
        for (let g = 0; g < GROOVES.length; g++) if (gro[g] && Math.abs(v - GROOVES[g]) < 0.5) hw += 1.0;
        if (v > -0.8 && v < 1.4) hw += 0.95;
        if (v < -2.5) hw -= (-2.5 - v) * 0.3;
        if (u >= hw) continue;
        const e = 1.6 * vnoise3(x * 0.21, y * 0.21, z * 0.21, 61);
        if (x < X_CAN0 + e || x > X_CAN1 + e) continue;
        setOpen(x, y, z, T_CANYON);
      }
    }
  }
}

function hallFloorCeil(x, z) {
  const dx = (x + 0.5 - HALL.x) / HALL.rx, dz = (z + 0.5 - HALL.z) / HALL.rz;
  const rr = Math.hypot(dx, dz);
  const ca = rr > 1e-6 ? dx / rr : 1, sa = rr > 1e-6 ? dz / rr : 0;
  const rw = 1 + 0.06 * vnoise2(ca * 2.2 + 5, sa * 2.2 + 5, 71) + 0.035 * vnoise2(ca * 6 + 9, sa * 6 + 9, 72);
  const r = rr / rw;
  if (r > 1) return null;
  let ceil = 7 + (HALL.h - 7) * Math.pow(Math.max(0, 1 - r * r), 0.55) + 3.5 * vnoise2(x * 0.035, z * 0.035, 73)
    + 4.5 * Math.max(0, vnoise2(x * 0.07, z * 0.07, 74) - 0.25);
  const ldx = (x + 0.5 - LAKE.x) / LAKE.rx, ldz = (z + 0.5 - LAKE.z) / LAKE.rz;
  const lr = Math.hypot(ldx, ldz) * (1 + 0.06 * vnoise2(x * 0.05, z * 0.05, 75));
  let floor, crisp = false;
  if (lr < 1) floor = -2.5 - 14 * Math.pow(1 - lr * lr, 0.6) + 1.5 * vnoise2(x * 0.08, z * 0.08, 76);
  else floor = Math.min((lr - 1) * 32, 8 + 2.5 * vnoise2(x * 0.04, z * 0.04, 77)) + vnoise2(x * 0.12, z * 0.12, 78) - 0.5;
  const id = Math.hypot(x + 0.5 - ISLE.x, z + 0.5 - ISLE.z);
  if (id < ISLE.r + 4) floor = Math.max(floor, 2.6 - 2.6 * Math.pow(id / ISLE.r, 2.5) + 0.4 * vnoise2(x * 0.2, z * 0.2, 79));
  // rimstone terraces (gours) on the north-east shore
  if (x >= GOUR.x0 && x <= GOUR.x1 && z >= GOUR.z0 && z <= GOUR.z1 && lr > 1.06 && r < 0.9) {
    floor = gourLevel(x, z); crisp = true;
  }
  // the river leaves the lake through a channel to the east
  const ex = clamp(x, EXITL.x0, EXITL.x1), ed = Math.abs(z + 0.5 - exitZ(ex));
  if (x >= EXITL.x0 - 2 && ed < 4.2) { floor = Math.min(floor, -3.2 - 0.6 * vnoise2(x * 0.2, z * 0.2, 80)); crisp = false; }
  return { r, floor, ceil, crisp };
}
function gourLevel(x, z) {
  return clamp(Math.floor((x - GOUR.x0) * 0.27 + 2.6 * vnoise2(x * 0.06, z * 0.09, 85) + 0.9 * vnoise2(x * 0.2, z * 0.2, 86) + 1.4), 1, 10);
}

function carveHall() {
  for (let x = HALL.x - HALL.rx - 8; x <= HALL.x + HALL.rx + 8; x++) {
    for (let z = HALL.z - HALL.rz - 8; z <= HALL.z + HALL.rz + 8; z++) {
      const c = hallFloorCeil(x, z);
      if (!c) continue;
      const yf = WL + c.floor, yc = WL + c.ceil;
      for (let y = Math.floor(yf) - 2; y <= Math.ceil(yc) + 3; y++) {
        const v = y + 0.5;
        let open;
        if (c.crisp) open = v > yf && v < yc + 2.4 * vnoise3(x * 0.17, y * 0.17, z * 0.17, 83);
        else if (v > yf + 2.5 && v < yc - 3.5) open = true;
        else {
          const n = vnoise3(x * 0.17, y * 0.17, z * 0.17, 83);
          open = v > yf + n * 1.3 && v < yc + n * 2.4;
        }
        if (open && c.r > 0.84) {
          const n2 = vnoise3(x * 0.11, y * 0.11, z * 0.11, 84);
          if (c.r + n2 * 0.05 > 0.995) open = false;
        }
        if (open) setOpen(x, y, z, T_HALL);
      }
    }
  }
}

function carveExit() {
  for (let x = 548; x <= 576; x++) {
    const zc = exitZ(x);
    const cap = x < 565 ? 99 : lerp(6.5, -2.4, smooth01((x - 565) / 8));
    for (let z = Math.floor(zc - 7); z <= Math.ceil(zc + 7); z++) {
      const u = z + 0.5 - zc;
      for (let y = WL - 6; y <= WL + 10; y++) {
        const v = y + 0.5 - WL;
        if (v >= cap) continue;
        const au = Math.abs(u) + 0.45 * vnoise3(x * 0.2, y * 0.2, z * 0.2, 88);
        let open = false;
        if (v >= 1.5) { const dv = (v - 1.5) * 3.6 / 4.2; open = au * au + dv * dv < 3.6 * 3.6; }
        else open = v > -3.6 + 1.2 * (u / 3.6) * (u / 3.6) && au < 3.6;
        if (open) setOpen(x, y, z, T_EXIT);
      }
    }
  }
}

function carveBall(cx, cy, cz, r, seed, tg, maxY = 1e9) {
  const R = Math.ceil(r + 1);
  for (let y = Math.floor(cy - R); y <= Math.ceil(cy + R); y++) {
    if (y > maxY) continue;
    for (let z = Math.floor(cz - R); z <= Math.ceil(cz + R); z++) for (let x = Math.floor(cx - R); x <= Math.ceil(cx + R); x++) {
      const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy, z + 0.5 - cz);
      if (d < r + 0.45 * vnoise3(x * 0.3, y * 0.3, z * 0.3, seed)) setOpen(x, y, z, tg);
    }
  }
}
function carveTube(pts, rad, seed, tg) {
  const curve = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(p[0], p[1], p[2])), false, 'centripetal');
  const len = curve.getLength(), n = Math.ceil(len / 0.4);
  for (let k = 0; k <= n; k++) {
    const p = curve.getPointAt(k / n);
    carveBall(p.x, p.y, p.z, rad * (1 + 0.18 * vnoise1(k * 0.05, seed)), seed, tg);
  }
}

const SUMP1 = [[183, WL - 1.4, tunnelZ(183)], [188, WL - 3.5, tunnelZ(188)], [193, WL - 5.5, ZC - 0.5], [198, WL - 7, ZC - 1.5],
  [203, WL - 7.5, ZC - 1.5], [208, WL - 6.5, ZC - 0.5], [213, WL - 4.5, ZC], [217, WL - 3, ZC]];
const SUMP2 = [[358, WL - 1.6, ZC], [363, WL - 3.5, ZC], [368, WL - 6.5, ZC], [373, WL - 9.5, ZC - 2], [380, WL - 12, ZC - 5],
  [388, WL - 13, ZC - 7], [396, WL - 12, ZC - 6], [403, WL - 10, ZC - 3], [410, WL - 7.5, ZC], [416, WL - 5, ZC + 2]];
const SUMP3 = [[566, WL - 2.2, exitZ(566)], [571, WL - 5, exitZ(571) + 0.6], [575, WL - 9, exitZ(575) + 1], [578, WL - 13, exitZ(578) + 1.2], [580, WL - 17, exitZ(580) + 1.2]];

// Narrow, fully flooded side passages that branch off the sumps and channels
const chambers = [];
function carveWorm(sx, sy, sz, yaw, len, rad, seed) {
  const r = mulberry32(seed);
  let x = sx, y = sy, z = sz, pitch = 0;
  const ceilY = WL - 3.2;
  for (let s = 0; s < len; s += 0.5) {
    yaw += (r() - 0.5) * 0.32;
    pitch = clamp(pitch + (r() - 0.5) * 0.2, -0.45, 0.45);
    x += Math.cos(yaw) * Math.cos(pitch) * 0.5;
    z += Math.sin(yaw) * Math.cos(pitch) * 0.5;
    y += Math.sin(pitch) * 0.5;
    if (y > ceilY - rad) { y = ceilY - rad; pitch = -Math.abs(pitch) - 0.1; }
    if (y < 6) { y = 6; pitch = Math.abs(pitch); }
    const rr = rad * (0.8 + 0.4 * (vnoise1(s * 0.25, seed) * 0.5 + 0.5));
    carveBall(x, y, z, rr, seed, T_SIDE, ceilY);
  }
  const cr = rad * 2.3;
  const cy = Math.min(y, ceilY - cr - 0.5);
  carveBall(x, cy, z, cr, seed + 1, T_CHAMBER, ceilY);
  chambers.push([x, cy, z, cr]);
}
const WORMS = [
  [199, WL - 7, ZC - 3, -Math.PI / 2, 26, 1.1], [206, WL - 7.5, ZC + 1, Math.PI / 2 - 0.3, 22, 1.0],
  [122, WL - 3.6, tunnelZ(122) + 5, Math.PI / 2, 18, 0.95], [64, WL - 3.4, tunnelZ(64) - 5, -Math.PI / 2 - 0.4, 16, 0.9],
  [252, WL - 4.6, ZC - 3, -Math.PI / 2, 21, 0.9], [331, WL - 4.2, ZC + 3, Math.PI / 2, 24, 1.1],
  [384, WL - 12.5, ZC - 7, -Math.PI / 2 - 0.5, 26, 1.1], [398, WL - 11.5, ZC - 4, Math.PI / 2 + 0.2, 20, 1.0],
  [372, WL - 9, ZC - 1, Math.PI / 2 - 0.9, 16, 0.85],
  [432, WL - 10, ZC - 30, -Math.PI / 2 - 0.3, 22, 1.0], [452, WL - 11, ZC + 34, Math.PI / 2 + 0.3, 20, 1.0],

/* =====================================================================
   Formations
   ===================================================================== */
function scanFloor(x, z, yStart) { // first solid voxel at/under yStart walking down through open space
  for (let y = yStart; y > 1; y--) if (vox[I(x, y, z)] >= 2) return y;
  return -1;
}
function scanCeil(x, z, yStart) {
  for (let y = yStart; y < SY - 1; y++) if (vox[I(x, y, z)] >= 2) return y;
  return -1;
}
function fillDisk(cx, cz, y, r, m, flutes = 0, phase = 0) {
  const R = Math.ceil(r + 1.5);
  for (let z = Math.floor(cz - R); z <= Math.ceil(cz + R); z++) for (let x = Math.floor(cx - R); x <= Math.ceil(cx + R); x++) {
    const dx = x + 0.5 - cx, dz = z + 0.5 - cz;
    let rr = r;
    if (flutes) rr *= 1 + flutes * Math.sin(Math.atan2(dz, dx) * 7 + phase);
    if (dx * dx + dz * dz < rr * rr) setSolid(x, y, z, m);
  }
}
function column(cx, cz, rMid, seed) {
  const fy = scanFloor(Math.round(cx), Math.round(cz), WL + 14);
  const cy = scanCeil(Math.round(cx), Math.round(cz), WL + 14);
  if (fy < 0 || cy < 0) return;
  for (let y = fy - 1; y <= cy + 1; y++) {
    const hb = y - fy, ht = cy - y;
    const r = rMid + 3.0 * Math.exp(-hb / 4.0) + 6.0 * Math.exp(-ht / 6.5) + 0.6 * vnoise1(y * 0.15, seed);
    const m = vnoise1(y * 0.21, seed + 3) > 0.55 ? DRIP : CALC;
    fillDisk(cx, cz, y, r, m, 0.1, y * 0.06 + seed);
  }
}
function stalactite(x, z, len, r0, seed) {
  const cy = scanCeil(x, z, WL + 3);
  if (cy < 0) return;
  const fy = scanFloor(x, z, cy - 1);
  len = Math.min(len, cy - Math.max(fy, WL) - 3);
  for (let k = 0; k < len; k++) {
    const t = k / len;
    fillDisk(x + 0.5, z + 0.5, cy - 1 - k, r0 * Math.pow(1 - t, 1.35) + 0.4, hash3(x, k, z, seed) < 0.7 ? DRIP : CALC);
  }
}
function stalagmite(x, z, h, r0, seed) {
  const fy = scanFloor(x, z, WL + 24);
  if (fy < WL) return;
  const cy = scanCeil(x, z, fy + 1);
  h = Math.min(h, cy - fy - 3);
  for (let k = 0; k < h; k++) {
    const t = k / h;
    fillDisk(x + 0.5, z + 0.5, fy + 1 + k, r0 * Math.pow(Math.max(0, 1 - Math.pow(t, 1.6)), 0.6) + 0.45, vnoise1(k * 0.3, seed) > 0.45 ? DRIP : CALC);
  }
}
function boulder(cx, cy, cz, r, seed) {
  const R = Math.ceil(r + 1);
  for (let y = cy - R; y <= cy + R; y++) for (let z = cz - R; z <= cz + R; z++) for (let x = cx - R; x <= cx + R; x++) {
    const d = Math.hypot((x - cx) * 1.0, (y - cy) * 1.25, z - cz);
    if (d < r + 0.8 * vnoise3(x * 0.35, y * 0.35, z * 0.35, seed)) setSolid(x, y, z, ROCK);
  }
}
function wedge(cx, cy, cz, rx, ry, rz, seed, m) {
  for (let y = Math.floor(cy - ry - 2); y <= cy + ry + 2; y++) for (let z = Math.floor(cz - rz - 2); z <= cz + rz + 2; z++) for (let x = Math.floor(cx - rx - 2); x <= cx + rx + 2; x++) {
    if (!inside(x, y, z)) continue;
    const i = I(x, y, z);
    if (vox[i] > 1) continue;
    const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry, dz = (z + 0.5 - cz) / rz;
    if (dx * dx + dy * dy + dz * dz < 1 + 0.28 * vnoise3(x * 0.25, y * 0.25, z * 0.25, seed)) vox[i] = m;
  }
}

function hallFormations() {
  const r = mulberry32(777);
  column(ISLE.x, ISLE.z, 5.0, 1);
  column(441, ZC + 50, 3.6, 2);
  column(522, ZC - 49, 4.6, 3);
  column(549, ZC + 27, 3.2, 4);
  column(452, ZC - 25, 2.2, 5);
  // hanging stalactites, some over the lake for reflections
  for (let k = 0; k < 46; k++) {
    const a = r() * Math.PI * 2, rr = Math.sqrt(r()) * 0.85;
    const x = Math.round(HALL.x + Math.cos(a) * rr * HALL.rx), z = Math.round(HALL.z + Math.sin(a) * rr * HALL.rz);
    if (Math.hypot(x - ISLE.x, z - ISLE.z) < 16) continue;
    stalactite(x, z, 5 + Math.floor(r() * r() * 20), 1.2 + r() * 2.6, k);
  }
  // stalagmites + fallen blocks on the dry shores
  for (let k = 0, tries = 0; k < 34 && tries < 600; tries++) {
    const a = r() * Math.PI * 2, rr = 0.55 + r() * 0.37;
    const x = Math.round(HALL.x + Math.cos(a) * rr * HALL.rx), z = Math.round(HALL.z + Math.sin(a) * rr * HALL.rz);
    if (x >= GOUR.x0 - 2 && x <= GOUR.x1 + 2 && z >= GOUR.z0 - 2 && z <= GOUR.z1 + 2) continue;
    if (Math.abs(z + 0.5 - exitZ(clamp(x, EXITL.x0, EXITL.x1))) < 7 && x > EXITL.x0 - 4) continue;
    const fy = scanFloor(x, z, WL + 24);
    if (fy < WL + 1) continue;
    if (k % 3 === 2) boulder(x, fy + 1, z, 2 + r() * 2.6, k + 40);
    else stalagmite(x, z, 4 + Math.floor(r() * r() * 16), 1.1 + r() * 2.3, k + 90);
    k++;
  }
}

// Amethyst geode in the north wall
let GEODE = null;
function carveGeode() {
  const x = 500, y = WL + 9;
  let z = ZC - 20;
  while (z > 4 && vox[I(x, y, z)] <= 1) z--;
  GEODE = [x + 0.5, y + 0.5, z - 1.5];
  carveBall(GEODE[0], GEODE[1], GEODE[2], 4.8, 66, T_GEODE);
}

/* Rimstone pools: a rim on every terrace edge, water behind it */
const poolCells = [];
function buildGours() {
  const lv = new Int16Array((GOUR.x1 - GOUR.x0 + 3) * (GOUR.z1 - GOUR.z0 + 3)).fill(-99);
  const W = GOUR.x1 - GOUR.x0 + 3;
  const L = (x, z) => lv[(z - GOUR.z0 + 1) * W + (x - GOUR.x0 + 1)];
  for (let z = GOUR.z0 - 1; z <= GOUR.z1 + 1; z++) for (let x = GOUR.x0 - 1; x <= GOUR.x1 + 1; x++) {
    const c = hallFloorCeil(x, z);
    let level = -99;
    if (c) {
      const top = scanFloor(x, z, WL + 26);
      if (top >= 0) level = top - WL + 1;
    }
    lv[(z - GOUR.z0 + 1) * W + (x - GOUR.x0 + 1)] = level;
  }
  for (let z = GOUR.z0; z <= GOUR.z1; z++) for (let x = GOUR.x0; x <= GOUR.x1; x++) {
    const c = hallFloorCeil(x, z);
    if (!c || !c.crisp) continue;
    const k = L(x, z);
    if (k < 1) continue;
    const y = WL + k;
    if (vox[I(x, y, z)] !== AIR) continue;
    const rim = L(x + 1, z) < k || L(x - 1, z) < k || L(x, z + 1) < k || L(x, z - 1) < k;
    setSolid(x, y - 1, z, RIM);
    if (rim) setSolid(x, y, z, RIM);
    else { vox[I(x, y, z)] = WATER; tag[I(x, y, z)] = T_GOUR; poolCells.push(I(x, y, z)); }
  }
}

function fillWater() {
  for (let y = 2; y < WL; y++) for (let z = 2; z < SZ - 2; z++) {
    let i = I(2, y, z);
    for (let x = 2; x < SX - 2; x++, i++) if (vox[i] === AIR) vox[i] = WATER;
  }
}

/* =====================================================================
   Surface painting (materials)
   ===================================================================== */
const EMIT = [];
EMIT[LICHEN] = [0.45, 0.95, 0.9, 14];
EMIT[WORM] = [0.35, 0.8, 1.0, 7];
EMIT[AMETH] = [0.78, 0.45, 1.0, 12];
EMIT[PEARL] = [0.3, 0.6, 1.0, 12];

function isLampVoxel(x, y, z) {
  if (!LAMP[x] || x > X_CAP0 - 4) return false;
  const P = tunnelP(x), v = y + 0.5 - WL;
  if (v < P.top - 0.4) return false;
  const sl = tunnelSlope(x), u = (z + 0.5 - tunnelZ(x)) / Math.sqrt(1 + sl * sl);
  return Math.abs(u - fissOff(x)) < 1.3;
}

function chooseMat(x, y, z, up, dn, tg) {
  const h = hash3(x, y, z, 7);
  const v = y - WL;
  switch (tg) {
    case T_GEODE: return AMETH;
    case T_GOUR: return RIM;
    case T_CHAMBER: return up && h < 0.4 ? PEARL : (h < 0.06 ? PEARL : (h < 0.55 ? CLAY : MUD));
    case T_SIDE: return up ? (h < 0.5 ? MUD : CLAY) : (h < 0.02 ? PEARL : (h < 0.5 ? LIME2 : DEEP));
    case T_SHAFT: return y < 12 || h < 0.07 ? PEARL : DEEP;
  }
  if (up && !dn) {
    if (y < WL) {
      if (tg === T_HALL) { const d = WL - y; return d > 7 ? (h < 0.65 ? MUD : CLAY) : d > 2 ? (h < 0.55 ? CLAY : SAND) : (h < 0.6 ? SAND : GRAVEL); }
      if (tg === T_CANYON) return h < 0.72 ? GRAVEL : SAND;
      return vnoise2(x * 0.09, z * 0.09, 91) > 0.1 ? GRAVEL : CLAY;

function lightAt(x, y, z, out) {

}

let wakeT = 0;
function updateBoat(dt) {
  const s = sampleAtTime(journeyT);
  boatState.p.copy(s.p); boatState.t.copy(s.t); boatState.u = s.u;
  const flat = tmpV.set(s.t.x, 0, s.t.z).normalize();
  boatState.fwd.lerp(flat, dt > 0 ? 1 - Math.exp(-dt * 2.2) : 1).normalize();
  const tt = U.uTime.value;
  const under = s.p.y < SURF - 0.6;
  boat.position.copy(s.p);
  boat.position.y += under ? 0 : Math.sin(tt * 1.3) * 0.04 - 0.06;
  const yaw = Math.atan2(-boatState.fwd.z, boatState.fwd.x);

}

function autoGaze(x) {

  pitch += 0.62 * bump(x, 252, 18) + 0.45 * bump(x, 332, 16) + 0.3 * bump(x, 448, 26) + 0.12 * bump(x, 98, 30);

}
function updateBoatCamera(dt) {

  const sf = clamp((boatState.p.y - (SURF - 2.0)) / 1.8, 0, 1);
  eye.y += lerp(0.95, 1.35, sf) + (under ? 0 : Math.sin(U.uTime.value * 1.3) * 0.04);

  if (idle) { look.userYaw *= Math.exp(-dt * 0.6); look.userPitch *= Math.exp(-dt * 0.6); }

  look.pitch = lerp(look.pitch, g[1] * (idle ? 1 : 0.3) + look.userPitch + Math.asin(clamp(boatState.t.y, -1, 1)) * 0.6, k);

  }

}

/* ---- double-click: fly to the rock face under the cursor ---- */
function voxelRay(o, d, maxT = 900) {
  let x = Math.floor(o.x), y = Math.floor(o.y), z = Math.floor(o.z);
  const sx = Math.sign(d.x) || 1, sy = Math.sign(d.y) || 1, sz = Math.sign(d.z) || 1;
  const tdx = Math.abs(1 / d.x), tdy = Math.abs(1 / d.y), tdz = Math.abs(1 / d.z);

  let t = 0, seenOpen = false;
  for (let k = 0; k < 4000 && t < maxT; k++) {
    const v = inside(x, y, z) ? vox[I(x, y, z)] : 255;
    if (v <= 1) seenOpen = true;
    else if (seenOpen && v < 255) return t;
    if (tx < ty && tx < tz) { t = tx; tx += tdx; x += sx; }
    else if (ty < tz) { t = ty; ty += tdy; y += sy; }
    else { t = tz; tz += tdz; z += sz; }
  }
  return -1;
}
renderer.domElement.addEventListener('dblclick', (e) => {
  if (mode !== 'orbit') return;
  const ndc = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  const ray = new THREE.Raycaster(); ray.setFromCamera(ndc, camera);
  const t = voxelRay(ray.ray.origin, ray.ray.direction);
  if (t < 0) return;
  const hit = ray.ray.origin.clone().addScaledVector(ray.ray.direction, Math.max(0, t - 0.6));
  const back = Math.min(camera.position.distanceTo(hit), 26);
  const p = hit.clone().addScaledVector(ray.ray.direction, -back);
  flyTo(p.toArray(), hit.toArray(), 1.8);
});

/* =====================================================================
   Sound (Web Audio, generated)
   ===================================================================== */
const Sound = (() => {
  let ctx = null, master, lp, wet, dry, send, water, on = false, last = '';
  function noiseBuf(sec, brown) {
    const b = ctx.createBuffer(2, ctx.sampleRate * sec, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let last = 0; for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w; } }
    return b;
  }
  function init() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0;
    lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 16000;
    master.connect(lp); lp.connect(ctx.destination);
    send = ctx.createConvolver();
    const ir = ctx.createBuffer(2, ctx.sampleRate * 4.5, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.6); }
    send.buffer = ir;
    wet = ctx.createGain(); wet.gain.value = 0.5; send.connect(wet); wet.connect(master);
    dry = ctx.createGain(); dry.gain.value = 0.9; dry.connect(master);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf(6, true); src.loop = true;
    const wf = ctx.createBiquadFilter(); wf.type = 'lowpass'; wf.frequency.value = 480;
    water = ctx.createGain(); water.gain.value = 0.16;
    src.connect(wf); wf.connect(water); water.connect(dry); water.connect(send); src.start();
    const drone = ctx.createGain(); drone.gain.value = 0.045;
    const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 360;
    for (const [f, type, det, g] of [[55, 'sine', 0, 0.5], [82.4, 'triangle', 4, 0.22], [110.3, 'sine', -5, 0.3], [164.8, 'sine', 3, 0.08]]) {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;
      const gg = ctx.createGain(); gg.gain.value = g; o.connect(gg); gg.connect(drone); o.start();
    }
    drone.connect(dlp); dlp.connect(dry); dlp.connect(send);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.045; const lg = ctx.createGain(); lg.gain.value = 0.02; lfo.connect(lg); lg.connect(drone.gain); lfo.start();
  }
  function drip(pan = 0, vol = 1) {
    if (!on || !ctx) return;
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain(), p = ctx.createStereoPanner();
    const f0 = 900 + Math.random() * 1500;
    o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.42, t + 0.13);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.14 * vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    p.pan.value = clamp(pan, -1, 1);
    o.connect(g); g.connect(p); p.connect(dry); p.connect(send); o.start(t); o.stop(t + 0.32);
  }
  function toggle() {
    if (!ctx) init();
    on = !on; last = '';
    if (on) ctx.resume();
    master.gain.setTargetAtTime(on ? 0.9 : 0, ctx.currentTime, 0.4);
    return on;
  }
  function update(under, hall) {
    if (!ctx || !on) return;
    const key = `${under}|${hall}`;
    if (key === last) return;
    last = key;
    const t = ctx.currentTime;
    lp.frequency.setTargetAtTime(under ? 420 : 16000, t, 0.25);
    wet.gain.setTargetAtTime(hall ? 0.95 : 0.5, t, 1.2);
    water.gain.setTargetAtTime(under ? 0.32 : hall ? 0.08 : 0.16, t, 0.6);
  }
  return { toggle, drip, update, get on() { return on; } };
})();

/* =====================================================================
   Frame loop
   ===================================================================== */
const clock = new THREE.Clock();
const camMed = { v: 0 };
const smooth = { fogDen: 0.0105, fogStart: 0, amb: 1.6, under: 0, skin: 0 };
let dripT = 1, fpsAcc = 0, fpsN = 0, fpsCheck = -3, readoutT = 0, lastHead = -1;
const camDir = new THREE.Vector3(), camUp = new THREE.Vector3();

function renderReflection() {
  if (!reflOn || camera.position.y < SURF + 0.05 || camMed.v === 1) { waterUniforms.uReflOn.value = 0; return; }
  waterUniforms.uReflOn.value = 1;
  mirrorCam.position.set(camera.position.x, 2 * SURF - camera.position.y, camera.position.z);
  camera.getWorldDirection(camDir); camDir.y = -camDir.y;
  camUp.set(0, 1, 0).applyQuaternion(camera.quaternion); camUp.y = -camUp.y;
  mirrorCam.up.copy(camUp);
  mirrorCam.lookAt(tmpV.copy(mirrorCam.position).add(camDir));
  mirrorCam.fov = camera.fov; mirrorCam.aspect = camera.aspect; mirrorCam.near = camera.near; mirrorCam.far = camera.far;
  mirrorCam.updateProjectionMatrix(); mirrorCam.updateMatrixWorld();
  mirrorVP.multiplyMatrices(mirrorCam.projectionMatrix, mirrorCam.matrixWorldInverse);
  const saveCam = U.uCam.value.clone(), saveMed = U.uMedium.value;
  U.uCam.value.copy(mirrorCam.position); U.uMedium.value = 0; U.uClip.value = 1;
  wisp.quaternion.copy(mirrorCam.quaternion);
  const px = stars.material.uniforms.uPx.value; stars.material.uniforms.uPx.value = px * 1.25;
  renderer.setRenderTarget(reflRT); renderer.clear(); renderer.render(scene, mirrorCam); renderer.setRenderTarget(null);
  stars.material.uniforms.uPx.value = px;
  U.uCam.value.copy(saveCam); U.uMedium.value = saveMed; U.uClip.value = 0;
  wisp.quaternion.copy(camera.quaternion);
}

function frame() {
  const dt = Math.min(clock.getDelta(), window.__dreamDtMax || 0.1);
  const tt = (U.uTime.value += dt);

  if (playing && !ending) {
    journeyT += dt * speedMul;
    if (journeyT >= TOTAL_T) { journeyT = TOTAL_T; ending = { t: 0 }; }
  }
  updateBoat(dt);
  updateEnding(dt);

  if (mode === 'boat') updateBoatCamera(dt);
  else {
    if (fly) {
      fly.k = Math.min(1, fly.k + dt / fly.dur);
      const e = easeInOut(fly.k);
      camera.position.lerpVectors(fly.p0, fly.p1, e);
      camera.position.y += Math.sin(Math.PI * e) * Math.min(70, fly.p0.distanceTo(fly.p1) / 5);
      controls.target.lerpVectors(fly.t0, fly.t1, e);
      if (fly.k >= 1) fly = null;
    } else if (follow) {
      const d = tmpV.copy(boatState.p).sub(controls.target).multiplyScalar(1 - Math.exp(-dt * 2.5));
      controls.target.add(d); camera.position.add(d);
    }
    controls.update();
  }
  wisp.quaternion.copy(camera.quaternion);
  wispFlick.value = 0.88 + 0.12 * Math.sin(tt * 7.1) * Math.sin(tt * 3.3);

  // medium around the camera
  const v = voxAt(camera.position);
  camMed.v = v === 255 || v >= 2 ? 2 : v === WATER && camera.position.y < SURF ? 1 : 0;
  U.uMedium.value = camMed.v;
  U.uCam.value.copy(camera.position);
  const outside = camMed.v === 2;
  const dTarget = mode === 'orbit' ? camera.position.distanceTo(controls.target) : 0;
  const k = 1 - Math.exp(-dt * 3);
  smooth.fogStart = lerp(smooth.fogStart, outside ? Math.max(0, dTarget * 0.82 - 30) : 0, k);
  smooth.fogDen = lerp(smooth.fogDen, outside ? 0.0105 * clamp(100 / Math.max(dTarget, 1), 0.12, 1) : 0.0105, k);
  smooth.amb = lerp(smooth.amb, outside ? 8.5 : 1.6, k);
  U.uHFall.value = lerp(U.uHFall.value, outside ? 60 : 22, k);
  smooth.under = lerp(smooth.under, camMed.v === 1 ? 1 : 0, 1 - Math.exp(-dt * 6));
  smooth.skin = lerp(smooth.skin, outside ? 1 : 0.0, k);
  U.uFogStart.value = smooth.fogStart; U.uFogDen.value = smooth.fogDen; U.uAmb.value = smooth.amb;
  skinMat.uniforms.uSkin.value = 0.35 + 0.65 * smooth.skin;
  finalPass.uniforms.uUnder.value = smooth.under;
  finalPass.uniforms.uTime.value = tt;
  U_fade.v = lerp(U_fade.v, U_fade.target, 1 - Math.exp(-dt * (U_fade.target > U_fade.v ? 0.9 : 1.6)));
  finalPass.uniforms.uFade.value = U_fade.v;
  const ms = Math.min(innerWidth, innerHeight) * pixelRatio;
  airMotes.material.uniforms.uSize.value = ms * 0.11; waterMotes.material.uniforms.uSize.value = ms * 0.08;
  stars.material.uniforms.uPx.value = pixelRatio;

  // drips falling from the ceiling near the focus point
  dripT -= dt;
  if (dripT <= 0) {
    dripT = 0.5 + Math.random() * 1.6;
    const c = mode === 'boat' ? boatState.p : controls.target;
    for (let a = 0; a < 6; a++) {
      const x = Math.floor(c.x + (Math.random() - 0.5) * 30), z = Math.floor(c.z + (Math.random() - 0.5) * 30);
      if (!inside(x, WL, z) || vox[I(x, WL - 1, z)] !== WATER || vox[I(x, WL, z)] !== AIR) continue;
      spawnRipple(x + Math.random(), z + Math.random(), 2.2 + Math.random() * 1.6);
      const d = Math.hypot(x - camera.position.x, z - camera.position.z);
      Sound.drip(clamp((x - camera.position.x) * 0.05, -1, 1), clamp(1.4 - d / 30, 0.1, 1));
      break;
    }
  }

  // captions follow the boat
  if (started && !ending) {
    let ci = -1;
    for (let c = 0; c < CAPTIONS.length; c++) if (boatState.p.x >= CAPTIONS[c][0]) ci = c;
    if (ci !== lastCap && ci >= 0) { lastCap = ci; showCaption(CAPTIONS[ci][1]); }
  }
  if (capTimer > 0) { capTimer -= dt; if (capTimer <= 0) $('caption').classList.remove('show'); }

  // readout
  const focus = mode === 'boat' || follow || playing ? boatState.p : controls.target;
  readoutT -= dt; if (readoutT <= 0) { readoutT = 0.25; updateReadout(focus); }
  if (Math.abs(boatState.u - lastHead) > 0.0004 || scrubbing) { lastHead = boatState.u; drawPlayhead(boatState.u); }
  Sound.update(camMed.v === 1, focus.x > 412);

  renderReflection();
  composer.render(dt);

  // adaptive resolution
  fpsCheck += dt;
  if (fpsCheck > 0) { fpsAcc += dt; fpsN++; }
  if (fpsCheck > 2.5) {
    const avg = fpsAcc / fpsN, cap = Math.min(devicePixelRatio || 1, MOBILE ? 1.5 : 1.75);
    if (avg > 0.034 && pixelRatio > 0.75) { pixelRatio = Math.max(0.75, pixelRatio - 0.2); resize(); }
    else if (avg < 0.0185 && pixelRatio < cap - 0.01) { pixelRatio = Math.min(cap, pixelRatio + 0.1); resize(); }
    fpsAcc = 0; fpsN = 0; fpsCheck = 0;
  }
  requestAnimationFrame(frame);
}

function updateReadout(p) {
  const x = Math.floor(p.x), z = Math.floor(p.z);
  let html = `<b>${sectionAt(p.x)}</b>`;
  if (inside(x, WL, z)) {
    let y = Math.max(WL, Math.floor(p.y)); if (vox[I(x, y, z)] >= 2) y = WL;
    let yc = y; while (yc < SY - 2 && vox[I(x, yc, z)] <= 1) yc++;
    let yf = WL - 1; while (yf > 1 && vox[I(x, yf, z)] <= 1) yf--;
    const under = p.y < SURF - 0.6;
    if (under && (mode === 'boat' || playing)) html += ` · <span class="dive">潜水中，水下 ${(SURF - p.y).toFixed(1)} 米</span>`;
    else {
      if (vox[I(x, WL, z)] <= 1) html += ` · 洞顶 <b>${yc - WL}</b> 米`;
      if (vox[I(x, WL - 1, z)] === WATER) html += ` · 水深 <b>${WL - 1 - yf}</b> 米`;
    }
  }
  if (started) html += ` · 航程 <b>${Math.round(boatState.u * PATHLEN)}</b>/${Math.round(PATHLEN)} 米`;
  $('readout').innerHTML = html;
}

/* =====================================================================
   Start
   ===================================================================== */
{
  const v = viewPose('overview');
  camera.position.set(v.p[0] + 120, v.p[1] + 160, v.p[2] + 140);
  controls.target.set(...v.t);
  flyTo(v.p, v.t, REDUCED ? 0.01 : 5.5);
}
updateBoat(0);
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawProfile(); lastHead = -1; });
await stage('沉入梦境', 1);
$('loader').classList.add('gone');
setTimeout(() => { if (!fly && !userTook && mode === 'orbit' && !REDUCED) controls.autoRotate = true; }, 6200);
requestAnimationFrame(frame);
finalPass.uniforms.uWobble.value = REDUCED ? 0 : 1;

window.__dream = {
  ready: true, genMs, faces: blocks.faces, chunks: blocks.geos.length, sprites: sprites.length, pathLen: PATHLEN, totalT: TOTAL_T,
  setView, setPlaying,
  setMode(m, instant) { setMode(m); if (instant) { blendIn = null; look.yaw = autoGaze(boatState.p.x)[0]; look.pitch = autoGaze(boatState.p.x)[1]; } },
  setCam(p, t) { fly = null; controls.autoRotate = false; camera.position.set(...p); controls.target.set(...t); controls.update(); },
  seekX(x) { journeyT = timeAtX(x); lastCap = -1; updateBoat(0); },
  get mode() { return mode; },
};
</script>
